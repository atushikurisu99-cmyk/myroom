name: Update event data
on:
  workflow_dispatch:
  schedule:
    - cron: "25 19 * * *"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect events from public sources
        run: node scripts/update-events.mjs
      - name: Commit changed event data
        run: |
          if git diff --quiet data/events.json; then
            echo "No event changes"
            exit 0
          fi
          git config user.name "taxi-event-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json
          git commit -m "Update Hiroshima event data"
          git push
