<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
  />
  <title>Taxi UI Fixed Lines</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html,
    body,
    #root {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #dfe5ee;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic UI",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      font: inherit;
    }

    button {
      white-space: nowrap;
    }

    /* 読みやすさ優先の3段階。標準は50代後半でも小さく感じにくい「中」。 */
    [data-ui-size="small"] {
      --tx-xs: 12px;
      --tx-sm: 14px;
      --tx-md: 16px;
      --tx-lg: 18px;
      --tx-xl: 22px;
      --tx-2xl: 30px;
      --tap-min: 44px;
    }

    [data-ui-size="medium"] {
      --tx-xs: 14px;
      --tx-sm: 16px;
      --tx-md: 18px;
      --tx-lg: 20px;
      --tx-xl: 24px;
      --tx-2xl: 34px;
      --tap-min: 48px;
    }

    [data-ui-size="large"] {
      --tx-xs: 16px;
      --tx-sm: 18px;
      --tx-md: 20px;
      --tx-lg: 22px;
      --tx-xl: 27px;
      --tx-2xl: 38px;
      --tap-min: 54px;
    }

    .tx-xs { font-size: var(--tx-xs); line-height: 1.35; }
    .tx-sm { font-size: var(--tx-sm); line-height: 1.35; }
    .tx-md { font-size: var(--tx-md); line-height: 1.32; }
    .tx-lg { font-size: var(--tx-lg); line-height: 1.28; }
    .tx-xl { font-size: var(--tx-xl); line-height: 1.18; }
    .tx-2xl { font-size: var(--tx-2xl); line-height: 1.08; }
    .ui-nowrap { white-space: nowrap; }
    .ui-tap { min-height: var(--tap-min); }

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="./constants.js" type="text/babel"></script>
  <script src="./utils.js" type="text/babel"></script>
  <script src="./geo.js" type="text/babel"></script>
  <script src="./components.js" type="text/babel"></script>
  <script src="./useTaxiAppState.js" type="text/babel"></script>
  <script src="./TopScreen.js" type="text/babel"></script>
  <script src="./StandbyScreen.js" type="text/babel"></script>
  <script src="./RideScreen.js" type="text/babel"></script>
  <script src="./FareScreen.js" type="text/babel"></script>
  <script src="./HistoryModal.js" type="text/babel"></script>
  <script src="./TaxiMiniApp.js" type="text/babel"></script>
</body>
</html>
